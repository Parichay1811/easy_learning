<!doctype html>
<!--
  04 · The AI teacher — YouTube Shorts + LinkedIn vertical
  1080×1920 (9:16) · 30 fps · 22 s
  Real footage: assets/footage/ai-teacher.mp4 (tools/record-ai-teacher.mjs), framed by a
  virtual camera that moves between the question box, the whole board and the drawing.
  Words stay inside the Shorts/Reels/TikTok safe area (y 288–1248, x 120–888).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="assets/brand/video.css" />
  <style>
    html, body { width: 1080px; height: 1920px; }
    @font-face { font-family: "KoreanUI"; src: local("Apple SD Gothic Neo"), local("AppleSDGothicNeo-Regular"); }

    #s-hook .t { position: absolute; left: 120px; right: 120px; text-align: center; }
    #s-hook #t1 { top: 330px; font-size: 112px; }
    #s-hook #t2 { top: 500px; font-size: 92px; }

    /* the footage panel and its virtual camera */
    #panel { position: absolute; left: 60px; top: 420px; width: 960px; height: 680px; border-radius: 34px; overflow: hidden;
      background: #0e1630; box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.9), 0 40px 90px rgba(0, 0, 0, 0.45); }
    #cam { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; }
    #cam video { display: block; width: 1600px; height: 1000px; }
    .step { position: absolute; left: 120px; right: 120px; top: 300px; text-align: center; font-size: 68px; }
    .step .n { display: inline-block; width: 76px; height: 76px; border-radius: 50%; background: var(--yellow); color: var(--navy);
      font-size: 50px; line-height: 76px; margin-right: 16px; vertical-align: 6px; }

    #s-noread .big { position: absolute; left: 120px; right: 120px; top: 360px; text-align: center; }
    #s-noread .big h2 { font-size: 118px; }
    #s-noread .big p { font-size: 64px; margin-top: 24px; }
    #s-noread .hello { position: absolute; font-family: "Fredoka", "Noto Sans JP", "KoreanUI", sans-serif; font-weight: 600; color: var(--ink);
      background: #fff; border-radius: 999px; padding: 12px 30px; font-size: 46px; box-shadow: 0 10px 26px rgba(20, 40, 80, 0.14); }

    #s-cta .logo { position: absolute; left: 160px; top: 320px; width: 760px; }
    #s-cta h2 { position: absolute; left: 120px; right: 120px; top: 720px; text-align: center; font-size: 104px; }
    #s-cta .btnwrap { position: absolute; left: 0; right: 0; top: 880px; display: flex; justify-content: center; }
    #s-cta .cta { font-size: 70px; padding: 26px 70px; }
  </style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">

  <!-- 1 · HOOK (0–3.6) -->
  <div id="s-hook" class="scene clip" data-start="0" data-duration="3.6" data-track-index="0" style="z-index: 30">
    <div class="in layer">
      <div class="bg bg-night"></div>
      <div id="t1" class="t display white">Ask anything.</div>
      <div id="t2" class="t display white">Get a lesson<br /><span style="color: var(--yellow)">drawn just for you.</span></div>
    </div>
  </div>

  <!-- 2 · FOOTAGE BACKDROP + STEP LABELS (3.4–14.5) -->
  <div id="s-foot" class="scene clip" data-start="3.4" data-duration="11.1" data-track-index="0" style="z-index: 10">
    <div class="in layer">
      <div class="bg bg-night"></div>
      <div id="st1" class="step display white"><span class="n">1</span>Ask</div>
      <div id="st2" class="step display white"><span class="n">2</span>It draws &amp; explains</div>
      <div id="st3" class="step display white"><span class="n">3</span>Tap to explore</div>
    </div>
  </div>
  <div id="panel" style="z-index: 15; opacity: 0">
    <div id="cam">
      <video id="ai-footage" class="clip" data-start="3.4" data-duration="11.1" data-media-start="0.4" data-track-index="1"
             src="assets/footage/ai-teacher.mp4" muted playsinline></video>
    </div>
  </div>

  <!-- 3 · NO READING NEEDED (14.3–17.3) -->
  <div id="s-noread" class="scene clip" data-start="14.3" data-duration="3.0" data-track-index="0" style="z-index: 20">
    <div class="in layer">
      <div class="bg bg-sky"></div>
      <div class="big">
        <h2 class="display">No reading<br /><span class="orange">needed.</span></h2>
        <p class="sub">In their own language.</p>
      </div>
      <span class="hello" style="left: 130px; top: 870px">Hello</span>
      <span class="hello" style="left: 560px; top: 850px">Hola</span>
      <span class="hello" style="left: 220px; top: 990px">Bonjour</span>
      <span class="hello" style="left: 620px; top: 980px">Ciao</span>
      <span class="hello" style="left: 150px; top: 1110px">Привет</span>
      <span class="hello" style="left: 520px; top: 1110px">こんにちは</span>
    </div>
  </div>

  <!-- 4 · END CARD (17.1–22) -->
  <div id="s-cta" class="scene clip" data-start="17.1" data-duration="4.9" data-track-index="0" style="z-index: 21">
    <div class="in layer">
      <div class="bg bg-meadow" style="background-position: 30% bottom"></div>
      <div class="veil"></div>
      <img class="logo" src="assets/brand/logo-wordmark.webp" alt="Learnigo" />
      <h2 class="display">Try it free</h2>
      <div class="btnwrap"><span id="cta-btn" class="cta">learnigo.eu</span></div>
    </div>
  </div>

  <!-- the puppy -->
  <div id="pup-hook" class="pup" style="z-index: 31; left: 270px; top: 760px; width: 540px; height: 500px">
    <video id="pup-talk" class="clip" data-start="0" data-duration="3.6" data-track-index="2" src="assets/companion/talk.webm" muted playsinline></video>
  </div>
  <div id="pup-cta" class="pup" style="z-index: 25; left: 270px; top: 1040px; width: 540px; height: 500px; opacity: 0">
    <video id="pup-cheer" class="clip" data-start="17.4" data-duration="4.6" data-track-index="2" src="assets/companion/cheer.webm" muted playsinline></video>
  </div>

  <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
       data-start="0" data-duration="22" data-track-index="5" data-track-kind="captions"
       data-width="1080" data-height="1920" style="z-index: 50"></div>

  <audio id="vo" class="clip" data-start="0" data-duration="19.8" data-track-index="6" data-volume="1" src="assets/voice/04-ai-teacher/vo.wav"></audio>
  <audio id="music" class="clip" data-start="0" data-duration="22" data-track-index="7" data-volume="0.16" data-fade-in="0.4" data-fade-out="2" src="assets/audio/bed.mp3"></audio>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const E = "power3.out";
  const enter = (id, t, d = 0.4) => tl.fromTo(`#${id} .in`, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
  const pop = (sel, t, from = 0.6) => tl.fromTo(sel, { opacity: 0, scale: from, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }, t);

  // Virtual camera: show footage point (fx, fy) at the panel centre (480, 340) at scale s.
  const at = (fx, fy, s) => ({ x: 480 - fx * s, y: 340 - fy * s, scale: s });
  const A = at(760, 788, 1.6);   // the question box, close
  const B = at(925, 470, 0.88);  // the whole board: drawing + explanation
  const C = at(705, 540, 1.6);   // the drawing, close

  // 1 · HOOK — words and puppy are there at frame 0
  tl.fromTo("#t1", { opacity: 1, scale: 1 }, { opacity: 1, scale: 1.03, duration: 1.4, ease: "none" }, 0);
  tl.fromTo("#t2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, 1.3);
  tl.fromTo("#pup-hook", { opacity: 1, y: 0 }, { opacity: 1, y: 0, duration: 0.1 }, 0);
  tl.to("#pup-hook", { opacity: 0, y: 40, duration: 0.3 }, 3.3);

  // 2 · FOOTAGE
  enter("s-foot", 3.4, 0.3);
  tl.fromTo("#panel", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 3.4);
  tl.fromTo("#cam", A, { ...A, duration: 0.1 }, 3.4);
  tl.to("#cam", { ...B, duration: 0.9, ease: "power2.inOut" }, 7.4);
  tl.to("#cam", { ...C, duration: 0.9, ease: "power2.inOut" }, 11.0);
  tl.to("#panel", { opacity: 0, duration: 0.3 }, 14.2);
  // step labels, one at a time
  tl.fromTo("#st1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 3.6);
  tl.to("#st1", { opacity: 0, duration: 0.25 }, 7.4);
  tl.fromTo("#st2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 7.65);
  tl.to("#st2", { opacity: 0, duration: 0.25 }, 11.0);
  tl.fromTo("#st3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, 11.25);

  // 3 · NO READING
  enter("s-noread", 14.3, 0.35);
  tl.fromTo("#s-noread .big", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 14.35);
  document.querySelectorAll("#s-noread .hello").forEach((el, i) =>
    tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 15.6 + i * 0.12));

  // 4 · END CARD
  enter("s-cta", 17.1, 0.4);
  tl.fromTo("#s-cta .logo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 17.2);
  tl.fromTo("#s-cta h2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, 17.6);
  pop("#cta-btn", 18.3, 0.7);
  tl.to("#cta-btn", { scale: 1.05, duration: 0.5, ease: "sine.inOut", repeat: 3, yoyo: true }, 19.3);
  tl.fromTo("#pup-cta", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, 17.4);

  window.__timelines["main"] = tl;
</script>
</body>
</html>
