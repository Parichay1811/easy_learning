    <!-- Site-wide JSON-LD (organization, website, app). The build replaces it
         with the full graph in each page's language (scripts/seo-prerender.mjs). -->
    <script type="application/ld+json" id="learnigo-site-schema">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "EducationalOrganization",
            "@id": "https://www.learnigo.eu/#organization",
            "name": "Learnigo",
            "url": "https://www.learnigo.eu/",
            "logo": "https://www.learnigo.eu/logo.png",
            "email": "info@futuresightanalytics.eu",
            "contactPoint": [
              { "@type": "ContactPoint", "contactType": "customer support", "email": "info@futuresightanalytics.eu" },
              { "@type": "ContactPoint", "contactType": "sales", "email": "solutions@futuresightanalytics.eu" }
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.learnigo.eu/#website",
            "name": "Learnigo",
            "url": "https://www.learnigo.eu/",
            "publisher": { "@id": "https://www.learnigo.eu/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
