<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070f">
  <title>Learnigo Live Teacher</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/gsap/gsap.min.js" defer></script>
  <script src="/vendor/gsap/Flip.min.js" defer></script>
</head>
<body data-mode="off">
  <!-- The 2.5D scene: layers at different depths drift against the pointer. -->
  <div class="scene" aria-hidden="true">
    <div class="layer aurora" data-depth="0.25"><i></i><i></i><i></i></div>
    <div class="layer floor" data-depth="0.6"></div>
    <canvas class="layer" id="space" data-depth="0.15"></canvas>
    <div class="vignette"></div>
  </div>
  <div class="edge-glow" aria-hidden="true"></div>

  <header class="hud">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span>Learnigo <b>Live</b></span></div>
    <div class="hud-mid">
      <span class="chip mode"><span class="dot" aria-hidden="true"></span><span id="status" role="status">Press Start, then allow the microphone</span></span>
      <span class="chip metric" id="tier" aria-live="off"></span>
    </div>
    <div class="controls">
      <button id="haptic" type="button" class="ctl" aria-pressed="true" title="Haptics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v16H8zM4 8v8M20 8v8M2 10v4M22 10v4"/></svg><span class="lbl">Haptics</span></button>
      <button id="sounds" type="button" class="ctl" aria-pressed="true" title="Sounds: little pops as the pictures appear"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span class="lbl">Sounds</span></button>
      <button id="mic" type="button" class="ctl" aria-pressed="true" title="Microphone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="lbl">Mic on</span></button>
      <button id="stop" type="button" class="ctl" title="Stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span class="lbl">Stop</span></button>
    </div>
  </header>

  <main class="stage">
    <section class="panel holo-wrap" data-tilt="5">
      <div class="holo-box">
        <div class="holo">
          <canvas id="board" aria-label="The teacher's board"></canvas>
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
          <div class="scan" aria-hidden="true"></div>
        </div>
        <p id="caption" class="caption" aria-live="off"></p>
      </div>
    </section>

    <aside class="panel side" data-tilt="3">
      <div class="presence">
        <div class="orb-slot live"></div>
        <div class="presence-text">
          <span class="label">Teacher</span>
          <span class="state" id="state">Waiting</span>
          <span class="meter" aria-hidden="true"><i id="meter"></i></span>
        </div>
      </div>
      <form id="ask" class="ask">
        <input id="text" autocomplete="off" placeholder="Type a question, or just talk…" aria-label="Your question">
        <button type="submit" aria-label="Ask">Ask</button>
      </form>
      <div id="chips" class="chips"></div>
      <div id="videos" class="videos" hidden><span class="v-head">Learn more</span><div class="v-row"></div></div>
      <ol id="log" class="log"></ol>
    </aside>
  </main>

  <!-- The start screen: the orb waits here, then flies into its panel. -->
  <section class="hero" id="hero">
    <div class="orb-slot hero-orb"><canvas id="orb" class="orb" aria-hidden="true"></canvas></div>
    <h1>Your live teacher</h1>
    <p class="sub">Ask anything out loud. It draws, explains and tests you, and stops the moment you talk.</p>
    <button id="start" class="start" type="button"><span>Start the lesson</span></button>
    <p id="warm" class="warm">Warming up the voice…</p>
    <p class="tip">Best with headphones · speech stays on this server</p>
  </section>

  <script type="module" src="/app.js"></script>
</body>
</html>
