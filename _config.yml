# GitHub Pages "deploy from a branch" builds this repository with Jekyll.
# Only the project documents belong on that site. The app's source code is
# left out: its READMEs contain JSX such as `{{ label: … }}`, which Jekyll's
# Liquid templating cannot parse, and that failed every Pages build.
exclude:
  - client
  - server
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - redeploy.sh
  - setup.sh
  - setup.bat
  - setup.ps1
